name: Consultas del bot

on:
  schedule:
    # El turno principal lo da cron-job.org cada 5 minutos. Este horario de GitHub es solo
    # un respaldo (GitHub lo retrasa y se salta turnos).
    - cron: "3,23,43 * * * *"
  workflow_dispatch:
    inputs:
      consulta:
        description: "Prueba una búsqueda sin Telegram (se muestra en el registro). Déjalo vacío para leer los mensajes."
        required: false
        default: ""

concurrency:
  group: consultas
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Leer mensajes y responder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONSULTA: ${{ github.event.inputs.consulta }}
        run: python consultas.py
